# Aplicação
spring.application.name=biblioteca-api
server.port=${PORT:8080}

# Banco de dados (local = MySQL; no Render = PostgreSQL via variáveis)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/biblioteca?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Criar tabelas sozinho (só quando SQL_INIT=always, usado no Render)
spring.sql.init.mode=${SQL_INIT:never}
spring.sql.init.schema-locations=classpath:schema-postgres.sql

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Regras de negócio
biblioteca.janela-sequencia-segundos=4
biblioteca.alerta-amarelo=60
biblioteca.alerta-vermelho=80
