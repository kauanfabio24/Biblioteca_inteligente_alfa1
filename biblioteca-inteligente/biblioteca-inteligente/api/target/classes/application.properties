# Aplicação
spring.application.name=biblioteca-api
server.port=8080

# Banco de dados
spring.datasource.url=jdbc:mysql://localhost:3306/biblioteca?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Regras de negócio
biblioteca.janela-sequencia-segundos=20
biblioteca.alerta-amarelo=60
biblioteca.alerta-vermelho=80
